<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NexStore logo">
  <defs>
    <linearGradient id="nex-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- hexagon plate: one storage node -->
  <path d="M32 3 56 16.5v31L32 61 8 47.5v-31Z" fill="url(#nex-g)"/>
  <path d="M32 8.5 51.5 19.5v25L32 55.5 12.5 44.5v-25Z" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
  <!-- N monogram -->
  <path d="M21 44V20l22 24V20" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- three node dots = 3 replicas of every object -->
  <circle cx="21" cy="20" r="3.4" fill="#fff"/>
  <circle cx="43" cy="20" r="3.4" fill="#fff"/>
  <circle cx="43" cy="44" r="3.4" fill="#fff"/>
</svg>
